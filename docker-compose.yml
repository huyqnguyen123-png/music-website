# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    container_name: music-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5433:5432"
    volumes:
      - music-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  music-db-data:
